#log{height:84px;overflow:auto;font-size:12px;margin-bottom:6px}

#chat input{width:calc(100% - 18px)}

#setup{top:8px;left:8px;width:min(330px,94vw);max-height:92vh;overflow:auto}@media(max-width:700px){#setup{top:auto;bottom:8px;left:50%;transform:translateX(-50%);max-height:50vh}}
.sw{display:inline-block;width:26px;height:26px;border-radius:50%;margin:3px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
.row{margin:8px 0}.row>span{display:block;font-size:12px;opacity:.8}
.opt{display:inline-block;padding:4px 9px;margin:2px;border-radius:6px;background:#22372f;cursor:pointer}.opt.on{background:var(--acc);color:#111}
#toast{top:60px;left:50%;transform:translateX(-50%);display:none}
#pad{bottom:20px;right:14px;width:110px;height:110px;border-radius:50%;opacity:.7;display:none;padding:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
</style></head><body>
